name: Weekly Curriculum Evolution

on:
  schedule:
    # 毎週日曜 21:00 JST (12:00 UTC) に自動実行
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run weekly curriculum correlation analysis & patch
        run: |
          npm run evolve:weekly
          npm run build

      - name: Commit weekly evolution report if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/weekly-evolution-report.md content/
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly curriculum evolution report & patch"
            git push
          else
            echo "No curriculum changes this week."
          fi
