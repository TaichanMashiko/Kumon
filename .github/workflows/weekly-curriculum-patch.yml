name: Weekly Curriculum Evolution & QA Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/curriculum/**'
  schedule:
    # 毎週日曜 21:00 JST (12:00 UTC) に自動実行
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit-and-evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Automated Curriculum QA Gate (All 670+ Steps)
        run: npm run audit:curriculum

      - name: Run 3-stage Tester Feedback Triage & Noise Filter
        run: npm run triage:feedback

      - name: Run Weekly Evolution & Change Report
        run: |
          npm run evolve:weekly
          npm run build

      - name: Commit Weekly Evolution Report if updated
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/weekly-evolution-report.md logs/feedback-triage-report.md content/
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly curriculum evolution report & automated updates"
            git push
          else
            echo "No curriculum changes this week."
          fi
